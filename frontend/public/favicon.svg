<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>

  <!-- Big-O Ring Symbol -->
  <circle cx="46" cy="54" r="25" fill="none" stroke="url(#glowGrad)" stroke-width="8.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- AI Sparkle Element -->
  <path d="M 68 20 L 71 29 L 80 32 L 71 35 L 68 44 L 65 35 L 56 32 L 65 29 Z" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Accent Pink Sparkle Dot -->
  <circle cx="34" cy="30" r="3.5" fill="#f43f5e" />
</svg>
